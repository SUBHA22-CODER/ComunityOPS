version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: community_ops_postgres
    restart: always
    environment:
      POSTGRES_USER: communityops
      POSTGRES_PASSWORD: communityops_password
      POSTGRES_DB: community_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: community_ops_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  optimizer:
    build:
      context: ./services/optimizer
      dockerfile: Dockerfile
    container_name: community_ops_optimizer
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - redis

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: community_ops_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  redis_data:
  n8n_data:
