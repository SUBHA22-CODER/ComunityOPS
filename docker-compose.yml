version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: community_ops_postgres
    restart: always
    environment:
      POSTGRES_USER: communityops
      POSTGRES_PASSWORD: communityops_password
      POSTGRES_DB: community_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: community_ops_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  optimizer:
    build:
      context: ./services/optimizer
      dockerfile: Dockerfile
    container_name: community_ops_optimizer
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
